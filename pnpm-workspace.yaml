packages:
  - packages/*

nodeLinker: hoisted
# 插件把内核包（@deepseek-ai/*）声明为 peerDependencies：它们由 DSH 宿主提供，
# 不从 npm 装（这些包在 npm 上的版本落后于宿主，盲目安装会解析到错误实现）。
# 关掉自动安装 peer，profile 解析时由宿主自己的内核满足。
autoInstallPeers: false

# 安全修复：dev 依赖树里的 zod 4.4.3 有内存耗尽告警，统一提到修复版
# （GHSA: zod oversized constrained collections；fixed in 4.6.6+）。运行时依赖不含 zod。
overrides:
  zod: ^4.6.7

# 供应链策略：CI 的 pnpm 用默认 minimumReleaseAge（24h）拒收新发布的包。
# 这些是本次升级到 DSH 0.2.3-alpha.2 线必须的官方内核/类型包（2026-11-22 发布），
# 只放行列出的精确版本；换版本时要重新评估。
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.10.0-alpha.1'
  - '@deepseek-ai/dsh-action-cards@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-brand@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-config@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-session-panel@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-session@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-skill@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.2.3-alpha.2'
  - '@deepseek-ai/schemastery@3.20.0-alpha.1'
