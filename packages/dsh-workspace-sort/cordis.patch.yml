# The dsh-workspace-sort bundle patch: one row over the profile root.
#
# The row carries both halves. The Host half persists the pins plus the two rule
# switches on `/dsh-workspace-sort/api/prefs` into
# `$DSH_HOME/workspace-sort/prefs.json` (never localStorage: the desktop Web
# server binds an ephemeral port, so the page origin changes on every restart),
# and keeps the last reorder report on `/dsh-workspace-sort/api/state` for
# `curl` diagnostics.
#
# The browser half
# (`dsh.client.platform: web`) sorts the sidebar Workspaces by their newest
# human prompt, puts a Workspace that is waiting for the user's input first, and
# writes that order through the official `workspaces.insertBefore` command, so
# the order is Host-durable exactly like a drag.
#
# Every knob is optional and lives here, not in the browser bundle. All three
# are `.volatile()` Host Config fields: the Host reads them through live
# `{ get() }` references and the browser half through `SyncedConfig` refs, so a
# change applies without a restart or a page reload.
#   enabled     false stops the browser half from sorting; the order is left
#               exactly as it is. Both Host routes stay mounted, so the pins keep
#               working and the switch can be turned back on live.
#   aggregate   true (default) ranks a container Workspace by its whole subtree;
#               false ranks it by its own Sessions only, which makes container
#               folders such as Code/Mubea sink to the bottom.
#   initialSort true (default) applies the activity order as soon as a page
#               loads; false waits for the next human prompt.
- insert:
    - id: workspace-sort
      name: "@cooper-zhuang/dsh-workspace-sort"
      # config:
      #   enabled: true
      #   aggregate: true
      #   initialSort: true
